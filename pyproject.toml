[build-system]
requires = ["setuptools>=61.2"]
build-backend = "setuptools.build_meta"

[project]
name = "Wake-T"
description = "A fast particle tracking code for plasma accelerators."
authors = [{name = "Angel Ferran Pousa", email = "angel.ferran.pousa@desy.de"}]
license = {text = "GPLv3"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
urls = {Homepage = "https://github.com/AngelFP/Wake-T"}
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "numba!=0.57.0",
    "scipy",
    "aptools~=0.2.0",
    "openpmd-api",
    "tqdm",
]
dynamic = ["version"]

[project.readme]
file = "README.md"
content-type = "text/markdown; charset=UTF-8"

[project.optional-dependencies]
test = [
    "pytest",
    "flake8",
    "matplotlib",
    "openpmd-viewer",
]

[tool.setuptools]
license-files = ["LICENSE"]
include-package-data = false

[tool.setuptools.packages]
find = {namespaces = false}

[tool.setuptools.dynamic]
version = {attr = "wake_t.__version__"}

[tool.black]
line-length = 79
target-version = ['py39', 'py310', 'py311']
