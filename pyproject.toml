[build-system]
requires = ["setuptools>=61.2"]
build-backend = "setuptools.build_meta"

[project]
name = "Wake-T"
description = "A fast particle tracking code for plasma accelerators."
authors = [{name = "Angel Ferran Pousa", email = "angel.ferran.pousa@desy.de"}]
license = {text = "GPLv3"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
urls = {Homepage = "https://github.com/AngelFP/Wake-T"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0",
    "numba!=0.57.0",
    "scipy",
    "aptools~=0.2.0",
    "openpmd-api",
    "tqdm",
]
dynamic = ["version"]

[project.readme]
file = "README.md"
content-type = "text/markdown; charset=UTF-8"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "matplotlib",
    "openpmd-viewer",
    "lasy",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

[tool.setuptools]
license-files = ["LICENSE"]
include-package-data = false

[tool.setuptools.packages]
find = {namespaces = false}

[tool.setuptools.dynamic]
version = {attr = "wake_t.__version__"}

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
exclude = ["tutorials/**"]
